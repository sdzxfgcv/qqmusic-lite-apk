name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: 下载新版 R8（避免旧版 d8 与 JDK 不兼容）
        run: |
          curl -sSL -o r8.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/9.5.33/r8-9.5.33.jar
          echo "R8_JAR=$GITHUB_WORKSPACE/r8.jar" >> "$GITHUB_ENV"

      - name: 构建（使用仓库内固定的 debug.keystore）
        run: bash build.sh

      - name: 校验签名证书指纹
        run: |
          echo "keystore 指纹："
          keytool -list -v -keystore debug.keystore -alias qqmusic -storepass android | grep -E 'SHA1|SHA256'
          echo "APK 签名指纹："
          keytool -printcert -jarfile output/QQMusicLite-v1.1.apk | grep -E 'SHA1|SHA256'

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-lite-apk
          path: output/*.apk
          if-no-files-found: error
